name:                opencode-hs
version:             0.1.0.0
synopsis:            A Haskell reimplementation of the OpenCode CLI agent
description:         Terminal-based AI coding agent with streaming LLM support,
                     type-safe tool system, SQLite session history, and brick TUI.
author:              dodofk
maintainer:          ricky.16811@gmail.com
license:             MIT
github:              dodofk/opencode-hs

ghc-options:
  - -Wall
  - -Wcompat
  - -Widentities
  - -Wincomplete-record-updates
  - -Wincomplete-uni-patterns
  - -Wmissing-export-lists
  - -Wno-unused-top-binds
  - -Werror

language: GHC2021

default-extensions:
  - OverloadedStrings
  - LambdaCase
  - TupleSections
  - ScopedTypeVariables
  - DerivingStrategies
  - DeriveGeneric
  - DeriveAnyClass
  - GeneralizedNewtypeDeriving

dependencies:
  # Core
  - base >= 4.17 && < 5
  - mtl >= 2.3
  - text >= 2.0
  - bytestring >= 0.11
  - containers >= 0.6
  - unordered-containers >= 0.2
  # Time
  - time >= 1.12
  # JSON / YAML
  - aeson >= 2.1
  - yaml >= 0.11
  # HTTP + streaming
  - http-conduit >= 2.3.8
  - http-types >= 0.12
  - conduit >= 1.3.5
  - conduit-extra >= 1.3
  - resourcet >= 1.2
  # SQLite
  - sqlite-simple >= 0.4.18
  # TUI
  - brick >= 2.1
  - vty >= 6.1
  - vty-crossplatform >= 0.4
  - microlens >= 0.4
  - microlens-mtl >= 0.2
  # UUID
  - uuid >= 1.3
  # Async / concurrency
  - async >= 2.2
  - stm >= 2.5
  # Process
  - process >= 1.6
  # File utilities
  - filepath >= 1.4
  - directory >= 1.3
  - Glob >= 0.10
  # Logging
  - fast-logger >= 3.2
  # CLI
  - optparse-applicative >= 0.18
  # Diff (for EditFile)
  - Diff >= 0.4
  # Unix signals
  - unix >= 2.8
  # MCP — added back in M6 once we resolve mcp-server/aeson compatibility
  # - mcp-server >= 0.1.0.19

library:
  source-dirs: src
  exposed-modules:
    - OpenCode.App
    - OpenCode.Run
    - OpenCode.CLI
    - OpenCode.App.Error
    - OpenCode.App.Types
    - OpenCode.Config
    - OpenCode.Model.Catalog
    - OpenCode.Types
    - OpenCode.DB
    - OpenCode.Session
    - OpenCode.Session.Events
    - OpenCode.Session.Prompt
    - OpenCode.Session.Summarize
    - OpenCode.Session.Title
    - OpenCode.LLM.Anthropic
    - OpenCode.LLM.Mock
    - OpenCode.LLM.OpenAI
    - OpenCode.LLM.Request
    - OpenCode.LLM.Schema
    - OpenCode.LLM.Types
    - OpenCode.Tool.Types
    - OpenCode.Tool.ReadFile
    - OpenCode.Tool.Registry
    - OpenCode.Tool.WriteFile
    - OpenCode.Tool.EditFile
    - OpenCode.Tool.Bash
    - OpenCode.Tool.Glob
    - OpenCode.Tool.Grep
    - OpenCode.TUI.Types
    - OpenCode.TUI.Overlay
    - OpenCode.TUI.Render
    - OpenCode.TUI.App
    - OpenCode.TUI.Command
    - OpenCode.MCP.Protocol
    - OpenCode.MCP.Client
    - OpenCode.MCP.Adapters

executables:
  opencode-hs:
    main:         Main.hs
    source-dirs:  app
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - opencode-hs

  opencode-mcp-mock:
    main:         Main.hs
    source-dirs:  test/mcp-mock
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - aeson
      - bytestring
      - text


tests:
  opencode-hs-test:
    main:         Spec.hs
    source-dirs:  test
    ghc-options:
      - -threaded
      - -rtsopts
      - -with-rtsopts=-N
    dependencies:
      - opencode-hs
      - hspec >= 2.11
      - hspec-discover >= 2.11
      - QuickCheck >= 2.14
      - temporary >= 1.3
      - direct-sqlite
    other-modules:
      - OpenCode.CLISpec
      - OpenCode.ConfigSpec
      - OpenCode.DBSpec
      - OpenCode.ErrorPathSpec
      - OpenCode.LLM.AnthropicSpec
      - OpenCode.LLM.MockSpec
      - OpenCode.LLM.OpenAISpec
      - OpenCode.LLM.RequestSpec
      - OpenCode.LLM.SchemaSpec
      - OpenCode.RunSpec
      - OpenCode.Session.EventsSpec
      - OpenCode.Session.PromptSpec
      - OpenCode.Session.SummarizeSpec
      - OpenCode.Session.TitleSpec
      - OpenCode.SessionSpec
      - OpenCode.TestEnv
      - OpenCode.Tool.BashSpec
      - OpenCode.Tool.EditFileSpec
      - OpenCode.Tool.GlobSpec
      - OpenCode.Tool.GrepSpec
      - OpenCode.Tool.ReadFileSpec
      - OpenCode.Tool.RegistrySpec
      - OpenCode.Tool.TypesSpec
      - OpenCode.Tool.WriteFileSpec
      - OpenCode.Model.CatalogSpec
      - OpenCode.TUI.AppSpec
      - OpenCode.TUI.CommandSpec
      - OpenCode.TUI.OverlaySpec
      - OpenCode.TUI.RenderSpec
      - OpenCode.TypesSpec
      - OpenCode.MCP.ProtocolSpec
      - OpenCode.MCP.ClientSpec
      - OpenCode.MCP.AdaptersSpec
      - Paths_opencode_hs
